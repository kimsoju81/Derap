name: Bina Derap TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Gantikan dengan URL sebenar aplikasi web Derap yang telah di-deploy (contoh: https://derap-studio.ai.studio atau URL GitHub Pages/Vercel anda)
  APP_URL: "https://derap-studio.ai.studio"
  APP_NAME: "Derap"
  PACKAGE_ID: "org.derap.nav.twa"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Nyahkod Keystore Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p android-signing
          echo "$KEYSTORE_BASE64" | base64 -d > android-signing/release.keystore

      - name: Konfigurasi Bubblewrap (JDK & Android SDK)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          JDK_DIR="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"
          HOST_NAME=$(echo "$APP_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')

          mkdir -p "$HOME/.bubblewrap"
          cat <<EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "$JDK_DIR",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          mkdir -p twa-app
          if [ ! -f "twa-app/twa-manifest.json" ]; then
            cat <<EOF > twa-app/twa-manifest.json
          {
            "packageId": "$PACKAGE_ID",
            "host": "$HOST_NAME",
            "name": "$APP_NAME",
            "launcherName": "Derap",
            "display": "standalone",
            "themeColor": "#001F3F",
            "navigationColor": "#001F3F",
            "backgroundColor": "#FFFFFF",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "$APP_URL/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android-signing/release.keystore",
              "alias": "$KEY_ALIAS"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "fallbackType": "customtabs",
            "features": {},
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "orientation": "default"
          }
          EOF
          fi

      - name: Jana projek Android TWA & bina APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -e
          cd twa-app

          if [ ! -f "build.gradle" ]; then
            npm init -y >/dev/null 2>&1
            npm install --no-save @bubblewrap/core >/dev/null 2>&1
            node -e '
              const fs = require("fs");
              const path = require("path");
              const { TwaManifest, GradleWrapper, TwaGenerator, Log } = require("@bubblewrap/core");

              (async () => {
                const log = new Log("derap-twa");
                const manifestJson = JSON.parse(fs.readFileSync("./twa-manifest.json", "utf8"));
                const twaManifest = new TwaManifest(manifestJson);
                const twaGenerator = new TwaGenerator();
                await twaGenerator.createTwaProject(process.cwd(), twaManifest, log);
                const gradleWrapper = new GradleWrapper(log);
                await gradleWrapper.install(process.cwd(), log);
              })().catch((err) => {
                console.error(err);
                process.exit(1);
              });
            '
          fi

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="../android-signing/release.keystore" \
            --signingKeyAlias="$KEY_ALIAS" \
            --storePassword="$KEYSTORE_PASSWORD" \
            --keyPassword="$KEY_PASSWORD" < /dev/null

      - name: Muat naik artifak APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: derap-studio-twa-release
          path: |
            twa-app/app-release-signed.apk
            twa-app/app-release-bundle.aab
          if-no-files-found: error
