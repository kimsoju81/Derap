name: Bina Derap Studio TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Tukar kepada URL sebenar aplikasi web Derap Studio anda yang telah di-deploy (HTTPS)
  APP_URL: "https://derap-studio.ai.studio"
  APP_NAME: "Derap Studio"
  PACKAGE_ID: "studio.ai.derap.twa"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Nyahkod Keystore Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p android-signing
          echo "$KEYSTORE_BASE64" | base64 -d > android-signing/release.keystore

      - name: Sediakan konfigurasi Bubblewrap (jika belum wujud)
        run: |
          set -e
          mkdir -p twa-app
          if [ ! -f "twa-app/twa-manifest.json" ]; then
            cat <<EOF > twa-app/twa-manifest.json
          {
            "packageId": "$PACKAGE_ID",
            "host": "$(echo $APP_URL | sed -e 's|^[^/]*//||' -e 's|/.*$||')",
            "name": "$APP_NAME",
            "launcherName": "Derap",
            "display": "standalone",
            "themeColor": "#0F172A",
            "navigationColor": "#000000",
            "backgroundColor": "#0F172A",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "$APP_URL/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android-signing/release.keystore",
              "alias": "${{ secrets.KEY_ALIAS }}"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "fallbackType": "customtabs",
            "features": {},
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "orientation": "default"
          }
          EOF
          fi

      - name: Jana projek TWA & bina APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd twa-app
          bubblewrap update --skipPwaValidation --manifest=twa-manifest.json
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="../android-signing/release.keystore" \
            --signingKeyAlias="$KEY_ALIAS" \
            --storePassword="$KEYSTORE_PASSWORD" \
            --keyPassword="$KEY_PASSWORD"

      - name: Muat naik artifak APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: derap-studio-twa-release
          path: |
            twa-app/app-release-signed.apk
            twa-app/app-release-bundle.aab
          if-no-files-found: error
